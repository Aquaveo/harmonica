[tox]
envlist = py314
requires = tox-uv

[testenv]
# uv does not read PIP_*. public/dev must be listed first: see .gitlab-ci.yml.
setenv =
    UV_INDEX_STRATEGY=unsafe-best-match
    UV_EXTRA_INDEX_URL=https://public.aquapi.aquaveo.com/aquaveo/dev/+simple/ https://aquapi.aquaveo.com/aquaveo/stable/+simple/
usedevelop=true
deps=
    coverage
    pytest
    pytest-cov
    # pytest-xdist
commands =
    # pytest -n auto --cov harmonica --durations=5
    pytest --cov harmonica --durations=5
    coverage html -d coverage_html --include=harmonica/* --skip-covered
    coverage report --skip-covered --include=harmonica/* --omit=harmonica/cli/*,harmonica/__main__.py, --fail-under 75 -m

[pytest]
testpaths =
    tests

[devpi:upload]
formats=sdist
